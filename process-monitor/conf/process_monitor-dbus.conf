<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

    <policy user="root">
    	<allow own="org.qti.process_monitor"/>
    	<allow send_type="method_call"/>
    </policy>
    
    <policy user="root">
        <allow send_destination="org.qti.faultmgr"/>
        <allow receive_sender="org.qti.faultmgr"/>
    </policy>

</busconfig>
